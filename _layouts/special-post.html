<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} - {{ site.title }}</title>

  <style>
    :root {
      --pink: #db4b78;
      --pink-dark: #c93868;
      --pink-soft: #fff1f5;
      --pink-border: #f0dce4;
      --ink: #2b2025;
      --muted: #74636a;
      --page-width: 900px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: #fff8fa;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, #fff1f5 0, #fff8fa 220px, #fff8fa 100%);
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--pink-dark);
      text-underline-offset: 3px;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--pink-border);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
    }

    .site-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: min(var(--page-width), calc(100% - 40px));
      min-height: 68px;
      margin: 0 auto;
    }

    .site-name {
      color: var(--ink);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .about-link {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      padding: 0 16px;
      border: 1px solid var(--pink-border);
      border-radius: 8px;
      background: #fff;
      color: var(--pink-dark);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease;
    }

    .about-link:hover,
    .about-link:focus-visible {
      border-color: var(--pink);
      background: var(--pink-soft);
      color: var(--pink-dark);
    }

    .post {
      width: min(var(--page-width), calc(100% - 40px));
      margin: 0 auto;
      padding: 72px 0 96px;
    }

    .post-header {
      max-width: 760px;
      margin-bottom: 44px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--pink-border);
    }

    .post-title {
      margin: 0 0 14px;
      color: var(--ink);
      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.2;
      letter-spacing: -0.045em;
    }

    .post-date {
      color: var(--muted);
      font-size: 14px;
    }

    .post-content {
      max-width: 760px;
      font-size: 17px;
    }

    .post-content > :first-child {
      margin-top: 0;
    }

    .post-content > :last-child {
      margin-bottom: 0;
    }

    .post-content h2,
    .post-content h3 {
      margin-top: 44px;
      color: var(--ink);
      line-height: 1.3;
    }

    .post-content p,
    .post-content ul,
    .post-content ol {
      margin-bottom: 24px;
    }

    .post-content ul,
    .post-content ol {
      padding-left: 1.4em;
    }

    .post-content li + li {
      margin-top: 8px;
    }

    .post-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .post-content pre {
      overflow-x: auto;
      padding: 16px;
      border-radius: 8px;
      background: #33272c;
      color: #fff8fa;
    }

    .post-content code {
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    .post-content :not(pre) > code {
      padding: 0.15em 0.4em;
      border-radius: 5px;
      background: #fce7ef;
      color: var(--pink-dark);
    }

    .post-content blockquote {
      margin: 28px 0;
      padding: 12px 20px;
      border-left: 4px solid var(--pink);
      background: var(--pink-soft);
      color: var(--muted);
    }

    @media (max-width: 700px) {
      .site-header-inner,
      .post {
        width: min(100% - 32px, var(--page-width));
      }

      .post {
        padding: 48px 0 64px;
      }

      .post-header {
        margin-bottom: 32px;
        padding-bottom: 22px;
      }

      .post-title {
        font-size: 34px;
      }

      .post-content {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-name" href="/" aria-label="返回首页">{{ site.title }}</a>
      <a class="about-link" href="/page/about.html">关于</a>
    </div>
  </header>

  <article class="post">
    <header class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>

      {% if page.date %}
        <div class="post-date">
          {{ page.date | date: "%Y-%m-%d" }}
        </div>
      {% endif %}
    </header>

    <main class="post-content">
      {{ content }}
    </main>
  </article>
</body>
</html>
