<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} - {{ site.title }}</title>

  <style>
    body {
      margin: 0;
      background: #f6f8fa;
      color: #24292f;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.8;
    }

    .post {
      max-width: 820px;
      margin: 60px auto;
      padding: 48px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .post-header {
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid #eaecef;
    }

    .post-title {
      margin: 0 0 12px;
      font-size: 40px;
      line-height: 1.25;
    }

    .post-date {
      color: #656d76;
      font-size: 14px;
    }

    .post-content img {
      max-width: 100%;
      border-radius: 10px;
    }

    .post-content pre {
      overflow-x: auto;
      padding: 16px;
      border-radius: 8px;
      background: #161b22;
      color: #e6edf3;
    }

    .post-content code {
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    .post-content blockquote {
      margin-left: 0;
      padding-left: 20px;
      border-left: 4px solid #0969da;
      color: #57606a;
    }

    @media (max-width: 700px) {
      .post {
        margin: 0;
        padding: 28px 20px;
        border-radius: 0;
      }

      .post-title {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>
  <article class="post">
    <header class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>

      {% if page.date %}
        <div class="post-date">
          {{ page.date | date: "%Y-%m-%d" }}
        </div>
      {% endif %}
    </header>

    <main class="post-content">
      {{ content }}
    </main>
  </article>
</body>
</html>
