<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英语学习</title>
    <link rel="stylesheet" href="../static/styles.css" />
    <script defer src="/static/alpine.js"></script>
    <script defer src="/libs/alpine.min.js"></script>
  </head>
  <body class="content-page">
    <site-header class="site-header" x-data="siteHeader" x-cloak></site-header>
    <main class="learning-page english-page">
      <section class="learning-hero english-hero">
        <div class="learning-hero-copy">
          <p class="learning-kicker">English practice · 02</p>
          <h1>每天一点，英语更进一步</h1>
          <p class="learning-lead">
            用短课、练习和复习，把词汇、语法、阅读、听力和表达练成真正能用的能力。
          </p>
        </div>
        <div class="hero-illustration-frame">
          <img
            class="hero-illustration"
            src="../static/images/english-hero-anime-girl.png"
            alt="戴圆框眼镜、穿米色卫衣的女生正在学习英语"
            width="1536"
            height="1024"
          />
        </div>
      </section>
      <nav class="learning-toolbar" aria-label="英语学习方向">
        <a href="study.html">学习总览</a><a href="dev.html">编程学习</a
        ><a href="blog.html">学习笔记</a>
      </nav>
      <section class="english-dashboard">
        <article class="learning-card english-path-card">
          <div class="english-section-heading">
            <div>
              <p class="english-eyebrow">LEARNING PATH</p>
              <h2>技术英语入门</h2>
              <p>完成一关，解锁下一步。每天 10 分钟就够了。</p>
            </div>
            <span class="english-unit-progress">2 / 8 关</span>
          </div>
          <div class="english-progress-track"><span style="width: 25%"></span></div>
          <div class="english-lesson-list">
            <button class="english-lesson is-complete" type="button">
              <span class="english-lesson-icon">✓</span>
              <span><strong>认识技术词汇</strong><small>高频词与固定搭配 · +10 XP</small></span>
              <b>已完成</b>
            </button>
            <button class="english-lesson is-current" type="button">
              <span class="english-lesson-icon">★</span>
              <span><strong>描述一个请求</strong><small>make a request · +15 XP</small></span>
              <b>开始</b>
            </button>
            <button class="english-lesson is-locked" type="button" disabled>
              <span class="english-lesson-icon">🔒</span>
              <span><strong>读懂响应结果</strong><small>完成上一关后解锁</small></span>
              <b>锁定</b>
            </button>
          </div>
        </article>

        <aside class="english-sidebar">
          <article class="learning-card english-daily-card">
            <div class="english-section-heading compact">
              <div><p class="english-eyebrow">DAILY GOAL</p><h2>今日目标</h2></div>
              <strong>2 / 3</strong>
            </div>
            <div class="english-daily-ring"><span>10<br /><small>分钟</small></span></div>
            <p>再完成一课，今天就达成目标！</p>
            <button class="english-primary-button" type="button">继续学习</button>
          </article>

          <article class="learning-card english-skills-card">
            <div class="english-section-heading compact">
              <div><p class="english-eyebrow">SKILLS</p><h2>五项能力</h2></div>
            </div>
            <div class="english-skill-list">
              <div><span>词汇</span><i><b style="width: 72%"></b></i><small>72%</small></div>
              <div><span>语法</span><i><b style="width: 48%"></b></i><small>48%</small></div>
              <div><span>阅读</span><i><b style="width: 36%"></b></i><small>36%</small></div>
              <div><span>听力</span><i><b style="width: 28%"></b></i><small>28%</small></div>
              <div><span>表达</span><i><b style="width: 20%"></b></i><small>20%</small></div>
            </div>
          </article>
        </aside>
      </section>
    </main>
  </body>
</html>
