<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天道酬勤</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <style>
    :root{
      --bg0:#0a0d14;
      --gold:#d4af37;
      --gold-dim:rgba(212,175,55,.25);
      --ink:#e8e2cf;
      --muted:#9aa0ae;
      --green:#4caf7d;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
      color:var(--ink);
      background:radial-gradient(1200px 600px at 50% -10%,#1b2438 0%,#0b0e14 55%) fixed,#0b0e14;
    }
    .kai{font-family:'STKaiti','KaiTi','Kaiti SC','Noto Serif SC',serif}

    /* ===== 头部 ===== */
    .hero{text-align:center;padding:32px 16px 8px}
    .seal{
      display:inline-flex;align-items:center;justify-content:center;
      width:56px;height:56px;border-radius:10px;
      background:linear-gradient(145deg,#a5322a,#7d241e);
      color:#f5e7c8;font-family:serif;font-size:34px;
      box-shadow:0 4px 14px rgba(165,50,42,.35),inset 0 1px 0 rgba(255,255,255,.25);
      transform:rotate(-3deg);
    }
    h1{
      font-size:44px;letter-spacing:14px;margin:14px 0 2px;
      background:linear-gradient(180deg,#f0d98c,#b8860b);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .sub{color:var(--muted);letter-spacing:6px;font-size:13px}
    .sys-badge{
      display:inline-block;margin:12px auto 0;padding:6px 18px;border-radius:999px;
      border:1px solid var(--gold-dim);background:rgba(212,175,55,.08);
      color:var(--gold);font-size:13px;letter-spacing:1px;
    }

    .stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px auto 12px;max-width:720px}
    .stat{min-width:118px;padding:10px 14px;border:1px solid var(--gold-dim);border-radius:12px;background:rgba(255,255,255,.03)}
    .stat .label{display:block;font-size:12px;color:var(--muted)}
    .stat .value{font-size:20px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}

    .xpbar{max-width:720px;margin:0 auto;height:10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(212,175,55,.2);overflow:hidden}
    .xpbar .fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#8a6d1f,#e6c35c);transition:width .6s}
    .xpnote{text-align:center;color:var(--muted);font-size:12px;margin-top:6px}

    /* ===== 主区：只一个开始按钮 ===== */
    main{
      flex:1;width:100%;max-width:960px;margin:0 auto;padding:0 16px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    }
    .btn-gold{
      padding:18px 60px;border-radius:999px;border:none;
      background:linear-gradient(135deg,#e6c35c,#b8860b);
      color:#241b05;font-weight:700;cursor:pointer;font-size:22px;letter-spacing:6px;
      transition:.2s;box-shadow:0 8px 24px rgba(184,134,11,.25);
    }
    .btn-gold:hover{filter:brightness(1.12);transform:translateY(-2px)}
    .session-clock{font-size:42px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:2px}
    .hint{font-size:12px;color:var(--muted)}

    /* ===== 底部 ===== */
    footer{
      width:100%;max-width:960px;margin:10px auto 30px;padding:0 16px;
      display:flex;flex-direction:column;align-items:center;gap:10px;
    }
    #lastAnnounce{font-size:13px;color:var(--muted);max-width:640px;text-align:center;min-height:18px;line-height:1.6}

    /* ===== 播报气泡 ===== */
    #toasts{
      position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:100;
      display:flex;flex-direction:column;gap:8px;align-items:center;
      pointer-events:none;width:min(92vw,520px);
    }
    .toast{
      padding:12px 20px;border-radius:12px;
      background:rgba(18,23,35,.96);border:1px solid var(--gold);
      color:#f0e6c8;font-size:14px;line-height:1.6;text-align:center;
      box-shadow:0 8px 30px rgba(0,0,0,.5);
      animation:tin .3s ease;
    }
    .toast.out{opacity:0;transition:.4s}
    @keyframes tin{from{transform:translateY(-14px);opacity:0}}

    @media (max-width:640px){
      h1{font-size:32px;letter-spacing:8px}
      .btn-gold{font-size:18px;padding:16px 44px}
      .session-clock{font-size:34px}
    }
  </style>
</head>
<body>

  <header class="hero">
    <div class="seal">勤</div>
    <h1 class="kai">天道酬勤</h1>
    <p class="sub">勤能补拙 · 学可医愚 · 功不唐捐</p>
    <p class="sys-badge">✨ 你已获得天道酬勤系统——凡有付出，必有所获</p>
    <div class="stats">
      <div class="stat"><span class="label">累计学习</span><span class="value" id="stTotal">0秒</span></div>
      <div class="stat"><span class="label">今日学习</span><span class="value" id="stToday">0秒</span></div>
      <div class="stat"><span class="label">经验值</span><span class="value" id="stXp">0</span></div>
      <div class="stat"><span class="label">当前等级</span><span class="value" id="stLevel">学徒</span></div>
    </div>
    <div class="xpbar"><div class="fill" id="xpFill"></div></div>
    <div class="xpnote" id="xpNote"></div>
  </header>

  <main>
    <button class="btn-gold kai" id="startBtn">开始学习</button>
    <div class="session-clock hidden" id="sClock">00:00</div>
    <div class="hint hidden" id="sHint">点击按钮可暂停 / 继续</div>
  </main>

  <footer>
    <div id="lastAnnounce"></div>
  </footer>

  <div id="toasts"></div>

<script>
'use strict';

/* ================= 数据与常量 ================= */
const KEY = 'tdcq_data';
const TITLES = ['学徒','书生','秀才','举人','贡士','进士','探花','榜眼','状元','翰林学士','大学士','大儒'];
const WELCOME = '你已获得天道酬勤系统——凡有付出，必有所获。';

/* ================= 工具函数 ================= */
const $ = id => document.getElementById(id);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const fmtDur = sec => {
  sec = Math.max(0, Math.floor(sec));
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60, p=[];
  if(h) p.push(h+'小时');
  if(m||h) p.push(m+'分');
  p.push(s+'秒');
  return p.join('');
};
const fmtShort = sec => {
  sec = Math.max(0, Math.floor(sec));
  if(sec < 60) return sec+'秒';
  if(sec < 3600) return Math.floor(sec/60)+'分';
  return Math.floor(sec/3600)+'时'+Math.floor(sec%3600/60)+'分';
};
const fmtClock = sec => String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
const levelOf = xp => Math.floor(Math.sqrt(Math.max(0,xp)/50)) + 1;
const lvStart = lv => 50*(lv-1)*(lv-1);

/* ================= 存档 ================= */
let data = { totalSec:0, todaySec:0, todayDate:'', xpFloat:0 };
try {
  const d = JSON.parse(localStorage.getItem(KEY) || 'null');
  if(d){ Object.assign(data, d); }
} catch(e){}
const now = new Date().toDateString();
if(data.todayDate !== now){ data.todaySec = 0; data.todayDate = now; }
let xpFloat = Number(data.xpFloat) || 0;
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      totalSec: data.totalSec, todaySec: data.todaySec,
      todayDate: new Date().toDateString(), xpFloat: xpFloat
    }));
  }catch(e){}
}

/* ================= 语音播报（TTS + 铃声 + 气泡） ================= */
function pickZhVoice(){
  try{
    const vs = speechSynthesis.getVoices();
    return vs.find(v => /zh|cmn|chinese/i.test((v.lang||'') + (v.name||''))) || null;
  }catch(e){ return null; }
}
let audioCtx = null;
function chime(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    [1046.5, 783.99].forEach((f,i)=>{ // 叮咚：高音在前，低音在后
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + i*0.22;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.12,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
      o.start(t); o.stop(t+0.55);
    });
  }catch(e){}
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(), 400); }, 6500);
}
function speak(text, withChime = true){
  $('lastAnnounce').textContent = '最新播报：' + text;
  toast(text);
  if(!('speechSynthesis' in window)){
    toast('当前浏览器不支持语音播报，仅显示文字');
    return;
  }
  try{
    if(withChime) chime();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 1; u.pitch = 1;
    const v = pickZhVoice();
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
let lastAckXp = 0, lastAckLv = 1;
function buildAnnounce(){
  const xp = Math.floor(xpFloat), lv = levelOf(xpFloat);
  const title = TITLES[Math.min(lv, TITLES.length) - 1];
  const gained = xp - lastAckXp;
  const heads = [
    '天道酬勤，功不唐捐！','一分耕耘，一分收获！',
    '勤能补拙，学可医愚！','学如逆水行舟，不进则退！',
    '书山有路勤为径！','宝剑锋从磨砺出，梅花香自苦寒来！'
  ];
  const tails = [
    '继续加油，向更高的境界迈进！','积跬步以至千里，坚持下去！',
    '今日之勤，必成明日之得！','学海无涯，勤者胜之！'
  ];
  const parts = [];
  if(lv > lastAckLv){
    parts.push('恭喜晋升！获得「' + title + '」称号！');
  }
  lastAckXp = xp; lastAckLv = lv;
  parts.push(pick(heads) + '你已学习' + fmtDur(data.totalSec) + '，累计获得经验' + xp
    + '点，当前等级' + lv + '级·' + title + '。');
  if(gained > 0) parts.push('本分钟获得经验' + gained + '点。');
  parts.push(pick(tails));
  return parts.join('');
}
function announce(){ speak(buildAnnounce()); }

/* ================= 开始学习 ================= */
let running = false, paused = false, sessionSec = 0, announceLeft = 60;
function renderStart(){
  const b = $('startBtn');
  if(!running) b.textContent = '开始学习';
  else if(paused) b.textContent = '已暂停 · 点击继续';
  else b.textContent = '学习中';
  $('sClock').classList.toggle('hidden', !running);
  $('sHint').classList.toggle('hidden', !running);
}
function toggleStart(){
  if(!running){
    running = true; paused = false;
    sessionSec = 0; announceLeft = 60;
    $('sClock').textContent = fmtClock(0);
    chime(); // 叮咚……
    setTimeout(() => speak(WELCOME, false), 800);
  } else if(paused){
    paused = false;
    toast('继续学习！');
  } else {
    paused = true;
    toast('已暂停');
  }
  renderStart();
}

/* ================= 统计渲染 ================= */
function updateStats(){
  $('stTotal').textContent = fmtShort(data.totalSec);
  $('stToday').textContent = fmtShort(data.todaySec);
  const xp = Math.floor(xpFloat);
  $('stXp').textContent = xp;
  const lv = levelOf(xpFloat);
  $('stLevel').textContent = TITLES[Math.min(lv, TITLES.length) - 1] + '·' + lv + '级';
  const pct = Math.min(100, Math.max(0, (xpFloat - lvStart(lv)) / (lvStart(lv+1) - lvStart(lv)) * 100));
  $('xpFill').style.width = pct + '%';
  $('xpNote').textContent = '距离下一等级还需 ' + Math.max(0, Math.ceil(lvStart(lv+1) - xpFloat)) + ' 经验';
  document.title = '天道酬勤 · ' + fmtShort(data.totalSec);
}

/* ================= 主循环 ================= */
let tickCount = 0;
function tick(){
  if(running && !paused){
    data.totalSec++; data.todaySec++;
    xpFloat += 1/6; // 每分钟 10 经验
    sessionSec++;
    $('sClock').textContent = fmtClock(sessionSec);
    announceLeft--;
    if(announceLeft <= 0){
      announceLeft = 60;
      announce();
    }
  }
  if(++tickCount % 10 === 0) save();
  updateStats();
}

/* ================= 初始化 ================= */
function init(){
  $('startBtn').addEventListener('click', toggleStart);

  // 预热语音列表（部分浏览器异步加载）
  if('speechSynthesis' in window){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }

  // 记录当前进度，供每分钟播报对比
  lastAckXp = Math.floor(xpFloat);
  lastAckLv = levelOf(xpFloat);

  window.addEventListener('beforeunload', save);
  setInterval(tick, 1000);
  renderStart();
  updateStats();
}
init();
</script>
</body>
</html>
