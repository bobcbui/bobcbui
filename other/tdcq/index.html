<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天道酬勤</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <style>
    :root{
      --bg0:#0a0d14;
      --gold:#d4af37;
      --gold-dim:rgba(212,175,55,.25);
      --ink:#e8e2cf;
      --muted:#9aa0ae;
      --green:#4caf7d;
      --red:#c0392b;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
      color:var(--ink);
      background:radial-gradient(1200px 600px at 50% -10%,#1b2438 0%,#0b0e14 55%) fixed,#0b0e14;
    }
    .kai{font-family:'STKaiti','KaiTi','Kaiti SC','Noto Serif SC',serif}

    /* ===== 头部 ===== */
    .hero{text-align:center;padding:32px 16px 8px}
    .seal{
      display:inline-flex;align-items:center;justify-content:center;
      width:56px;height:56px;border-radius:10px;
      background:linear-gradient(145deg,#a5322a,#7d241e);
      color:#f5e7c8;font-family:serif;font-size:34px;
      box-shadow:0 4px 14px rgba(165,50,42,.35),inset 0 1px 0 rgba(255,255,255,.25);
      transform:rotate(-3deg);
    }
    h1{
      font-size:44px;letter-spacing:14px;margin:14px 0 2px;
      background:linear-gradient(180deg,#f0d98c,#b8860b);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .sub{color:var(--muted);letter-spacing:6px;font-size:13px}
    .sys-badge{
      display:inline-block;margin:12px auto 0;padding:6px 18px;border-radius:999px;
      border:1px solid var(--gold-dim);background:rgba(212,175,55,.08);
      color:var(--gold);font-size:13px;letter-spacing:1px;
    }

    .stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px auto 12px;max-width:720px}
    .stat{min-width:118px;padding:10px 14px;border:1px solid var(--gold-dim);border-radius:12px;background:rgba(255,255,255,.03)}
    .stat .label{display:block;font-size:12px;color:var(--muted)}
    .stat .value{font-size:20px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}

    .xpbar{max-width:720px;margin:0 auto;height:10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(212,175,55,.2);overflow:hidden}
    .xpbar .fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#8a6d1f,#e6c35c);transition:width .6s}
    .xpnote{text-align:center;color:var(--muted);font-size:12px;margin-top:6px}

    /* ===== 主区 ===== */
    main{flex:1;width:100%;max-width:960px;margin:0 auto;padding:0 16px}
    .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-top:18px}
    .mode-card{
      position:relative;padding:16px 12px;
      border:1px solid rgba(212,175,55,.22);border-radius:14px;
      background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
      cursor:pointer;transition:.2s;text-align:center;
    }
    .mode-card:hover{transform:translateY(-2px);border-color:rgba(212,175,55,.5)}
    .mode-card.active{box-shadow:0 0 0 1px var(--gold),0 8px 24px rgba(212,175,55,.15);border-color:var(--gold)}
    .m-icon{font-size:30px}
    .m-name{margin:6px 0 4px;font-size:16px;font-weight:600}
    .m-desc{font-size:12px;color:var(--muted);min-height:32px}
    .m-btn{
      margin-top:10px;padding:7px 18px;border-radius:999px;
      border:1px solid var(--gold);background:transparent;color:var(--gold);
      cursor:pointer;font-size:13px;transition:.2s;
    }
    .m-btn:hover{background:rgba(212,175,55,.12)}
    .m-btn.running{background:var(--gold);color:#231b04}
    .m-dot{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:#333;border:1px solid #555}
    .mode-card.active .m-dot{background:var(--green);box-shadow:0 0 8px var(--green)}

    /* ===== 修行面板 ===== */
    .workspace{
      margin:16px 0 8px;min-height:300px;
      border:1px solid rgba(212,175,55,.25);border-radius:16px;
      background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.008));
      padding:26px 20px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
    }
    .empty{text-align:center;color:var(--muted)}
    .empty .big{font-size:44px;opacity:.6}
    .hidden{display:none!important}
    .panel{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:14px}

    .quiz-word{
      font-size:34px;font-weight:700;color:#f0e6c8;text-align:center;
      min-height:52px;display:flex;align-items:center;letter-spacing:2px;
    }
    .quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
    .opt{
      padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
      background:rgba(255,255,255,.03);color:var(--ink);font-size:16px;
      cursor:pointer;transition:.15s;
    }
    .opt:hover{border-color:var(--gold);color:var(--gold)}
    .opt.right{background:rgba(76,175,125,.25);border-color:var(--green);color:#8fdcb2}
    .opt.wrong{background:rgba(192,57,43,.22);border-color:var(--red);color:#f0a49b}
    .opt.done{opacity:.55;pointer-events:none}
    .quiz-info{font-size:13px;color:var(--muted)}
    .quiz-info b{color:var(--gold)}

    .math-row{display:flex;gap:10px;align-items:center}
    #mIn{
      width:150px;padding:10px 14px;border-radius:10px;
      border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);
      color:var(--ink);font-size:20px;text-align:center;outline:none;
    }
    #mIn:focus{border-color:var(--gold)}
    .btn-gold{
      padding:10px 24px;border-radius:999px;border:none;
      background:linear-gradient(135deg,#e6c35c,#b8860b);
      color:#241b05;font-weight:700;cursor:pointer;font-size:15px;transition:.2s;
    }
    .btn-gold:hover{filter:brightness(1.12)}
    .btn-gold.big{font-size:17px;padding:14px 42px;letter-spacing:2px}
    .shake{animation:shake .3s}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

    .passage{font-size:22px;line-height:2.2;letter-spacing:1px;text-align:center}
    .passage span.rest{color:rgba(232,226,207,.55)}
    .passage span.ok{color:#8fdcb2}
    .passage span.cur{background:rgba(212,175,55,.28);border-radius:4px;color:var(--gold)}
    #tIn{
      width:100%;padding:10px;border-radius:10px;
      border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);
      color:var(--ink);font-size:16px;outline:none;text-align:center;
    }
    .hint{font-size:12px;color:var(--muted)}

    .focus-clock{font-size:64px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
    .quote{color:var(--muted);font-size:16px;letter-spacing:2px;text-align:center}

    /* ===== 底部 ===== */
    footer{
      width:100%;max-width:960px;margin:10px auto 30px;padding:0 16px;
      display:flex;flex-direction:column;align-items:center;gap:10px;
    }
    #lastAnnounce{font-size:13px;color:var(--muted);max-width:640px;text-align:center;min-height:18px;line-height:1.6}
    .reset{background:none;border:none;color:#6b7280;cursor:pointer;font-size:12px;text-decoration:underline}

    /* ===== 右下角持续学习按钮 ===== */
    .cont-btn{
      position:fixed;right:22px;bottom:22px;z-index:60;
      display:flex;align-items:center;gap:8px;
      padding:12px 18px;border-radius:999px;
      background:rgba(16,21,32,.92);border:1px solid var(--gold-dim);
      color:var(--ink);cursor:pointer;font-size:14px;user-select:none;
      box-shadow:0 8px 24px rgba(0,0,0,.45);transition:.2s;
    }
    .cont-btn:hover{border-color:var(--gold)}
    .cont-btn.on{border-color:var(--gold);background:linear-gradient(135deg,rgba(212,175,55,.16),rgba(212,175,55,.05))}
    .cont-dot{width:10px;height:10px;border-radius:50%;background:#556}
    .cont-btn.on .cont-dot{background:var(--green);animation:pulse 1.4s infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(76,175,125,.5)}50%{box-shadow:0 0 0 7px rgba(76,175,125,0)}}
    .cont-per{font-size:11px;color:var(--muted);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:2px 6px}
    #contCd{font-variant-numeric:tabular-nums;color:var(--gold);min-width:44px;text-align:center}

    /* ===== 播报气泡 ===== */
    #toasts{
      position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:100;
      display:flex;flex-direction:column;gap:8px;align-items:center;
      pointer-events:none;width:min(92vw,520px);
    }
    .toast{
      padding:12px 20px;border-radius:12px;
      background:rgba(18,23,35,.96);border:1px solid var(--gold);
      color:#f0e6c8;font-size:14px;line-height:1.6;text-align:center;
      box-shadow:0 8px 30px rgba(0,0,0,.5);
      animation:tin .3s ease;
    }
    .toast.out{opacity:0;transition:.4s}
    @keyframes tin{from{transform:translateY(-14px);opacity:0}}

    @media (max-width:640px){
      h1{font-size:32px;letter-spacing:8px}
      .quiz-word{font-size:26px}
      .focus-clock{font-size:46px}
      .cont-btn{right:12px;bottom:12px;padding:10px 14px;font-size:13px}
    }
  </style>
</head>
<body>

  <header class="hero">
    <div class="seal">勤</div>
    <h1 class="kai">天道酬勤</h1>
    <p class="sub">勤能补拙 · 学可医愚 · 功不唐捐</p>
    <p class="sys-badge">✨ 你已获得天道酬勤系统——凡有付出，必有所获</p>
    <div class="stats">
      <div class="stat"><span class="label">累计学习</span><span class="value" id="stTotal">0秒</span></div>
      <div class="stat"><span class="label">今日学习</span><span class="value" id="stToday">0秒</span></div>
      <div class="stat"><span class="label">经验值</span><span class="value" id="stXp">0</span></div>
      <div class="stat"><span class="label">当前等级</span><span class="value" id="stLevel">学徒</span></div>
    </div>
    <div class="xpbar"><div class="fill" id="xpFill"></div></div>
    <div class="xpnote" id="xpNote"></div>
  </header>

  <main>
    <section class="modes" id="modeGrid"></section>

    <section class="workspace" id="workspace">
      <div class="empty" id="emptyState">
        <div class="big">📚</div>
        <p>选择一门功课，开始今日修行</p>
      </div>

      <div class="panel hidden" id="panel-word">
        <div class="quiz-word" id="wWord"></div>
        <div class="quiz-opts" id="wOpts"></div>
        <div class="quiz-info">连续答对 <b id="wStreak">0</b> 题 · 答对 +15 经验</div>
      </div>

      <div class="panel hidden" id="panel-poem">
        <div class="quiz-word" id="pLine" style="font-size:24px"></div>
        <div class="quiz-opts" id="pOpts"></div>
        <div class="quiz-info" id="pSrc"></div>
      </div>

      <div class="panel hidden" id="panel-math">
        <div class="quiz-word" id="mQ"></div>
        <div class="math-row">
          <input id="mIn" inputmode="numeric" autocomplete="off" placeholder="答案">
          <button class="btn-gold" id="mBtn">提交</button>
        </div>
        <div class="quiz-info">答对 +15 经验 · 题目难度随等级提升</div>
      </div>

      <div class="panel hidden" id="panel-type">
        <div class="passage" id="tPassage"></div>
        <div class="hint">点击输入框后直接打字，无需回车</div>
        <input id="tIn" autocomplete="off" spellcheck="false">
        <div class="quiz-info">完成一篇 +30 经验</div>
      </div>

      <div class="panel hidden" id="panel-focus">
        <div class="focus-clock" id="fClock">00:00</div>
        <div class="quiz-info">静心专注，时间自动化为经验</div>
        <div class="quote" id="fQuote"></div>
      </div>
    </section>
  </main>

  <footer>
    <button class="btn-gold big kai" id="announceBtn">🎙 播报学习成果</button>
    <div id="lastAnnounce"></div>
    <button class="reset" id="resetBtn">清空学习数据</button>
  </footer>

  <div class="cont-btn" id="contBtn" title="点击开/关持续学习自动播报">
    <span class="cont-dot"></span>
    <span id="contLabel">持续学习</span>
    <span id="contCd" class="hidden">05:00</span>
    <span class="cont-per" id="contPer">每5分</span>
  </div>

  <div id="toasts"></div>

<script>
'use strict';

/* ================= 数据与常量 ================= */
const KEY = 'tdcq_data';
const TITLES = ['学徒','书生','秀才','举人','贡士','进士','探花','榜眼','状元','翰林学士','大学士','大儒'];

  word:  { name:'单词速记', icon:'📖', desc:'英文单词四选一，答对得经验' },
  poem:  { name:'古诗对句', icon:'🖋', desc:'补全诗句，品先贤之风' },
  math:  { name:'口算修行', icon:'🧮', desc:'算术题随等级提升难度' },
  type:  { name:'打字淬炼', icon:'⌨️', desc:'敲完名言名句，练手亦练心' },
  focus: { name:'专注静修', icon:'🧘', desc:'只看时间流逝，静心专注' }
};
const WORDS = [
  ['abandon','放弃'],['ability','能力'],['achieve','实现'],['acquire','获得'],
  ['adapt','适应'],['admire','钦佩'],['ambition','雄心'],['ancient','古老的'],
  ['anxious','焦虑的'],['appreciate','感激'],['arrange','安排'],['attack','攻击'],
  ['attempt','尝试'],['attitude','态度'],['attract','吸引'],['avoid','避免'],
  ['balance','平衡'],['benefit','益处'],['brave','勇敢的'],['brilliant','杰出的'],
  ['career','职业'],['challenge','挑战'],['cherish','珍惜'],['comfort','安慰'],
  ['compare','比较'],['complete','完成'],['confident','自信的'],['courage','勇气'],
  ['curious','好奇的'],['decide','决定'],['describe','描述'],['develop','发展'],
  ['diligent','勤奋的'],['discover','发现'],['eager','渴望的'],['effort','努力'],
  ['encourage','鼓励'],['energy','精力'],['excellent','优秀的'],['experience','经验'],
  ['familiar','熟悉的'],['generous','慷慨的'],['honest','诚实的'],['improve','改进'],
  ['inspire','激励'],['knowledge','知识'],['measure','衡量'],['memory','记忆'],
  ['patient','耐心的'],['perfect','完美的'],['practice','练习'],['progress','进步'],
  ['proud','自豪的'],['purpose','目的'],['quality','品质'],['reduce','减少'],
  ['respect','尊敬'],['reward','回报'],['sincere','真诚的'],['struggle','奋斗']
];
const POEMS = [
  { t:'春晓', a:'孟浩然',   line:'春眠不觉晓，处处闻啼鸟。', ans:'鸟', wrong:['虫','犬','蝉'] },
  { t:'静夜思', a:'李白',   line:'床前明月光，疑是地上霜。', ans:'霜', wrong:['雪','冰','银'] },
  { t:'悯农·其二', a:'李绅',line:'谁知盘中餐，粒粒皆辛苦。', ans:'辛苦', wrong:['艰难','酸楚','心酸'] },
  { t:'登鹳雀楼', a:'王之涣',line:'欲穷千里目，更上一层楼。', ans:'楼', wrong:['台','阁','山'] },
  { t:'望庐山瀑布', a:'李白',line:'飞流直下三千尺，疑是银河落九天。', ans:'九天', wrong:['云霄','碧空','苍穹'] },
  { t:'游子吟', a:'孟郊',   line:'谁言寸草心，报得三春晖。', ans:'晖', wrong:['光','阳','恩'] },
  { t:'梅花', a:'王安石',   line:'墙角数枝梅，凌寒独自开。', ans:'开', wrong:['放','绽','生'] },
  { t:'江雪', a:'柳宗元',   line:'孤舟蓑笠翁，独钓寒江雪。', ans:'雪', wrong:['水','月','风'] },
  { t:'元日', a:'王安石',   line:'千门万户曈曈日，总把新桃换旧符。', ans:'符', wrong:['挂','贴','门'] },

  { t:'相思', a:'王维',     line:'红豆生南国，春来发几枝。', ans:'枝', wrong:['叶','芽','花'] },
  { t:'登高', a:'杜甫',     line:'无边落木萧萧下，不尽长江滚滚来。', ans:'来', wrong:['流','去','逝'] },

const PASSAGES = [
  '天道酬勤，功不唐捐。学如弓弩，才如箭镞。',
  '书山有路勤为径，学海无涯苦作舟。',

const PER_OPTS = [{m:2,l:'每2分'},{m:5,l:'每5分'},{m:10,l:'每10分'}];

/* ================= 工具函数 ================= */
const $ = id => document.getElementById(id);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fmtDur = sec => {
  sec = Math.max(0, Math.floor(sec));
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60, p=[];
  if(h) p.push(h+'小时');
  if(m||h) p.push(m+'分');
  p.push(s+'秒');
  return p.join('');
};
const fmtShort = sec => {
  sec = Math.max(0, Math.floor(sec));
  if(sec < 60) return sec+'秒';
  if(sec < 3600) return Math.floor(sec/60)+'分';
  return Math.floor(sec/3600)+'时'+Math.floor(sec%3600/60)+'分';
};
const fmtClock = sec => String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
const levelOf = xp => Math.floor(Math.sqrt(Math.max(0,xp)/50)) + 1;
const lvStart = lv => 50*(lv-1)*(lv-1);

/* ================= 存档 ================= */
let data = { totalSec:0, todaySec:0, todayDate:'', xpFloat:0 };
try {
  const d = JSON.parse(localStorage.getItem(KEY) || 'null');
  if(d){ Object.assign(data, d); }
} catch(e){}
const now = new Date().toDateString();
if(data.todayDate !== now){ data.todaySec = 0; data.todayDate = now; }
let xpFloat = Number(data.xpFloat) || 0;
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      totalSec: data.totalSec, todaySec: data.todaySec,
      todayDate: new Date().toDateString(), xpFloat: xpFloat
    }));
  }catch(e){}
}

/* ================= 播报（语音 + 气泡） ================= */
function pickZhVoice(){
  try{
    const vs = speechSynthesis.getVoices();
    return vs.find(v => /zh|cmn|chinese/i.test((v.lang||'') + (v.name||''))) || null;
  }catch(e){ return null; }
}
let audioCtx = null;
function chime(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    [880, 1174].forEach((f,i)=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + i*0.18;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.15,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
      o.start(t); o.stop(t+0.4);
    });
  }catch(e){}
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(), 400); }, 6500);
}
function speak(text){
  $('lastAnnounce').textContent = '最新播报：' + text;
  toast(text);
  if(!('speechSynthesis' in window)){
    toast('当前浏览器不支持语音播报，仅显示文字');
    return;
  }
  try{
    chime();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 1; u.pitch = 1;
    const v = pickZhVoice();
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function buildAnnounce(){
  const xp = Math.floor(xpFloat), lv = levelOf(xpFloat);
  const title = TITLES[Math.min(lv, TITLES.length) - 1];
  const heads = [
    '天道酬勤，功不唐捐！','一分耕耘，一分收获！',
    '勤能补拙，学可医愚！','学如逆水行舟，不进则退！',
    '书山有路勤为径！','宝剑锋从磨砺出，梅花香自苦寒来！'
  ];
  const tails = [
    '继续加油，向更高的境界迈进！','积跬步以至千里，坚持下去！',
    '今日之勤，必成明日之得！','学海无涯，勤者胜之！'
  ];
  return pick(heads) + '你已学习' + fmtDur(data.totalSec) + '，获得经验' + xp
    + '点，当前等级' + lv + '级·' + title + '。' + pick(tails);
}
function announce(){ speak(buildAnnounce()); }

/* ================= 学习模式 ================= */
let activeMode = null, paused = false;
let streak = 0;
let curWord = null, curPoem = null, curMath = null;
let curPassage = null, typeIdx = 0;
let sessionSec = 0;
let grid = null;

function gain(x){ xpFloat += x; }

function newWord(){
  curWord = pick(WORDS);
  const others = shuffle(WORDS.filter(p => p[1] !== curWord[1]).map(p => p[1])).slice(0,3);
  $('wWord').textContent = curWord[0];
  $('wStreak').textContent = streak;
  const box = $('wOpts'); box.innerHTML = '';
  shuffle([curWord[1], ...others]).forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = o;
    b.onclick = () => answerWord(b, o);
    box.appendChild(b);
  });
}
function answerWord(btn, o){
  if(btn.classList.contains('done')) return;
  if(o === curWord[1]){
    btn.classList.add('right');
    [...$('wOpts').children].forEach(b => b.classList.add('done'));
    const bonus = streak >= 4 ? 10 : 0;
    streak++; gain(15 + bonus);
    $('wStreak').textContent = streak;
    toast('答对了！+' + (15 + bonus) + ' 经验');
    setTimeout(newWord, 600);
  } else {
    btn.classList.add('wrong');
    streak = 0;
    $('wStreak').textContent = 0;
  }
}

function newPoem(){
  curPoem = pick(POEMS);
  $('pLine').textContent = curPoem.line;
  $('pSrc').textContent = '——' + curPoem.a + '《' + curPoem.t + '》';
  const box = $('pOpts'); box.innerHTML = '';
  shuffle([curPoem.ans, ...curPoem.wrong]).forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = o;
    b.onclick = () => answerPoem(b, o);
    box.appendChild(b);
  });
}
function answerPoem(btn, o){
  if(btn.classList.contains('done')) return;
  if(o === curPoem.ans){
    btn.classList.add('right');
    [...$('pOpts').children].forEach(b => b.classList.add('done'));
    streak++; gain(15);
    $('wStreak').textContent = streak;
    toast('妙哉！+15 经验');
    setTimeout(newPoem, 600);
  } else {
    btn.classList.add('wrong');
  }
}

function newMath(){
  const lv = levelOf(xpFloat);
  let q, a;
  if(lv <= 2){
    const x = ri(1,20), y = ri(1,20); q = x + ' + ' + y; a = x + y;
  } else if(lv <= 5){
    const x = ri(12,99), y = ri(2,9);
    if(Math.random() < 0.5){ q = x + ' + ' + y; a = x + y; }
    else { q = x + ' - ' + y; a = x - y; }
  } else if(lv <= 9){
    const x = ri(2,12), y = ri(2,12); q = x + ' × ' + y; a = x * y;
  } else {
    const x = ri(3,15), y = ri(3,15), z = ri(2,9); q = x + ' × ' + y + ' + ' + z; a = x*y + z;
  }
  curMath = { a: String(a), q: q };
  $('mQ').textContent = q + ' = ?';
  $('mIn').value = '';
  $('mIn').focus();
}
function submitMath(){
  if(!curMath) return;
  const el = $('mIn'), v = el.value.trim();
  if(v === '') return;
  if(v === curMath.a){
    gain(15);
    toast('回答正确！+15 经验');
    newMath();
  } else {
    el.classList.add('shake');
    setTimeout(()=>el.classList.remove('shake'), 300);
    el.value = '';
  }
}

function nextPassage(){ return pick(PASSAGES); }
function renderPassage(){
  const p = $('tPassage');
  if(typeIdx >= curPassage.length){
    gain(30);
    toast('完成一篇！+30 经验');
    typeIdx = 0;
    curPassage = nextPassage();
  }
  p.innerHTML = '';
  for(let i = 0; i < curPassage.length; i++){
    const s = document.createElement('span');
    s.textContent = curPassage[i] === ' ' ? ' ' : curPassage[i];
    s.className = i < typeIdx ? 'ok' : (i === typeIdx ? 'cur' : 'rest');
    p.appendChild(s);
  }
}

function activate(key){
  if(activeMode === key){
    if(!paused){ paused = true; toast(MODES[key].name + '已暂停'); }
    else { paused = false; toast('继续修行：' + MODES[key].name); if(key === 'type') $('tIn').focus(); }
  } else {
    activeMode = key; paused = false;
    if(key === 'word') newWord();
    if(key === 'poem') newPoem();
    if(key === 'math') newMath();
    if(key === 'type'){ curPassage = nextPassage(); typeIdx = 0; renderPassage(); $('tIn').focus(); }
    if(key === 'focus'){ sessionSec = 0; $('fClock').textContent = fmtClock(0); $('fQuote').textContent = pick(QUOTES); }
    toast('开始修行：' + MODES[key].name);
  }
  refresh();
}
function refresh(){
  $('emptyState').classList.toggle('hidden', !!activeMode);
  for(const key in MODES){
    const card = grid.querySelector('[data-mode="' + key + '"]');
    const btn = card.querySelector('.m-btn');
    card.classList.toggle('active', activeMode === key);
    if(activeMode === key){
      btn.textContent = paused ? '继续修行' : '暂停修行';
      btn.classList.add('running');
    } else {
      btn.textContent = '开始修行';
      btn.classList.remove('running');
    }
    $('panel-' + key).classList.toggle('hidden', activeMode !== key);
  }
}

/* ================= 持续学习（自动播报） ================= */
let contOn = false, contIdx = 1, contSecs = PER_OPTS[1].m * 60, contLeft = contSecs;
function renderCont(){
  $('contLabel').textContent = contOn ? '持续学习中' : '持续学习';
  $('contCd').textContent = fmtClock(contLeft);
  $('contCd').classList.toggle('hidden', !contOn);
  $('contPer').textContent = PER_OPTS[contIdx].l;
  $('contBtn').classList.toggle('on', contOn);
}
function toggleCont(){
  contOn = !contOn;
  if(contOn){
    contLeft = contSecs;
    toast('持续学习已开启，每' + PER_OPTS[contIdx].m + '分钟自动播报一次');
  } else {
    toast('持续学习已关闭');
  }
  renderCont();
}

/* ================= 统计渲染 ================= */
function updateStats(){
  $('stTotal').textContent = fmtShort(data.totalSec);
  $('stToday').textContent = fmtShort(data.todaySec);
  const xp = Math.floor(xpFloat);
  $('stXp').textContent = xp;
  const lv = levelOf(xpFloat);
  $('stLevel').textContent = TITLES[Math.min(lv, TITLES.length) - 1] + '·' + lv + '级';
  const pct = Math.min(100, Math.max(0, (xpFloat - lvStart(lv)) / (lvStart(lv+1) - lvStart(lv)) * 100));
  $('xpFill').style.width = pct + '%';
  $('xpNote').textContent = '距离下一等级还需 ' + Math.max(0, Math.ceil(lvStart(lv+1) - xpFloat)) + ' 经验';
  document.title = '天道酬勤 · ' + fmtShort(data.totalSec);
}

/* ================= 主循环 ================= */
let tickCount = 0;
function tick(){
  if(activeMode && !paused){
    data.totalSec++; data.todaySec++;
    xpFloat += 1/6; // 每分钟 10 经验
    if(activeMode === 'focus'){
      sessionSec++;
      $('fClock').textContent = fmtClock(sessionSec);
    }
  }
  if(contOn){
    contLeft--;
    if(contLeft <= 0){
      contLeft = contSecs;
      renderCont();
      announce();
    } else {
      renderCont();
    }
  }
  if(++tickCount % 10 === 0) save();
  updateStats();
}

/* ================= 初始化 ================= */
function init(){
  grid = $('modeGrid');
  for(const key in MODES){
    const m = MODES[key];
    const card = document.createElement('div');
    card.className = 'mode-card';
    card.dataset.mode = key;
    card.innerHTML =
      '<div class="m-icon">' + m.icon + '</div>' +
      '<div class="m-name">' + m.name + '</div>' +
      '<div class="m-desc">' + m.desc + '</div>' +
      '<button class="m-btn">开始修行</button>' +
      '<span class="m-dot"></span>';
    card.addEventListener('click', () => activate(key));
    grid.appendChild(card);
  }

  $('announceBtn').addEventListener('click', announce);
  $('mBtn').addEventListener('click', submitMath);
  $('mIn').addEventListener('keydown', e => { if(e.key === 'Enter') submitMath(); });
  $('contBtn').addEventListener('click', e => {
    if(e.target.id === 'contPer') return;
    toggleCont();
  });
  $('contPer').addEventListener('click', e => {
    e.stopPropagation();
    contIdx = (contIdx + 1) % PER_OPTS.length;
    contSecs = PER_OPTS[contIdx].m * 60;
    if(contOn) contLeft = contSecs;
    renderCont();
  });
  $('resetBtn').addEventListener('click', () => {
    if(confirm('确定清空所有学习数据吗？此操作不可恢复。')){
      localStorage.removeItem(KEY);
      data = { totalSec:0, todaySec:0, todayDate:new Date().toDateString(), xpFloat:0 };
      xpFloat = 0;
      updateStats();
      toast('学习数据已清空');
    }
  });
  $('tIn').addEventListener('keydown', e => {
    if(!curPassage) return;
    if(e.key === 'Backspace'){
      if(typeIdx > 0){ typeIdx--; renderPassage(); }
      e.preventDefault();
      return;
    }
    if(e.key.length === 1){
      e.preventDefault();
      const want = curPassage[typeIdx];
      if(e.key === want){
        typeIdx++;
      } else {
        $('tIn').classList.add('shake');
        setTimeout(() => $('tIn').classList.remove('shake'), 300);
      }
      renderPassage();
    }
  });
  $('workspace').addEventListener('click', () => {
    if(activeMode === 'type' && !paused) $('tIn').focus();
  });

  // 预热语音列表（部分浏览器异步加载）
  if('speechSynthesis' in window){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }

  window.addEventListener('beforeunload', save);
  setInterval(tick, 1000);
  refresh();
  renderCont();
  updateStats();
}
init();
</script>
