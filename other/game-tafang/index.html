<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2D 塔防游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #080b16; }
    #game-container {
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: radial-gradient(circle at 50% 20%, #172445 0%, #080b16 72%);
      touch-action: none;
    }
    canvas { display: block; max-width: 100%; max-height: 100%; image-rendering: pixelated; border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
