<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>百世修仙 - 文字修仙世界</title>
<link rel="stylesheet" href="resources/style.css">
<script src="lib/phaser.min.js"></script>
<script type="importmap">
{
  "imports": {
    "@/": "./src/"
  }
}
</script>
</head>
<body>
<div id="gameWrap">
<canvas id="gameCanvas"></canvas>

<div class="ui-layer">
  <!-- 局内 HUD -->
  <div id="hud" class="panel">
    <div class="flex-between">
      <span>第 <strong id="stageText">1</strong> 关</span>
      <span>波次 <span id="waveCounter">0/5</span></span>
    </div>
    <div class="bar-wrap"><span class="label">●</span><div class="bar-bg"><div id="hpFill" class="bar-fill"></div></div><span class="bar-text" id="hpText">100/100</span></div>
    <div class="bar-wrap"><span class="label">★</span><div class="bar-bg"><div id="xpFill" class="bar-fill"></div></div><span class="bar-text" id="xpText">0/5</span></div>
    <div class="flex-between mt8">
      <span>Lv.<span id="levelText">1</span></span>
      <span>击杀 <strong id="killText">0</strong></span>
      <span>总等级 <strong id="totalLevelText">1</strong></span>
    </div>
    <div id="cardsHud"></div>
  </div>

  <!-- Status -->
  <div id="status">消息</div>
  <!-- Loot popup -->
  <div id="loot-popup" class="panel"></div>

  <!-- 主页（局外） -->
  <div id="mainMenu">
    <!-- 顶部：等级信息 + 右上角设置 -->
    <div class="menu-top">
      <div class="menu-stats panel">
        <div class="flex-between"><span>游戏总等级</span><strong id="menuTotalLevel">1</strong></div>
        <div class="bar-bg"><div id="menuTotalXpFill" class="bar-fill"></div></div>
        <div id="menuTotalXpText">0/40</div>
        <div class="menu-sub">最高通关：第 <span id="menuMaxStage">0</span> 关</div>
      </div>
      <button class="btn btn-sec menu-settings-top" data-action="toggleSettingsPanel">⚙️</button>
    </div>

    <!-- 四页菜单（顶部：等级下方） -->

    <div id="menu-panel" class="panel">
      <div id="menu-tabs">
        <button class="menu-tab active" id="menu-tab-stage" data-action="menuTab" data-arg="stage">关卡</button>
        <button class="menu-tab" id="menu-tab-equip" data-action="menuTab" data-arg="equip">装备</button>
        <button class="menu-tab" id="menu-tab-skill" data-action="menuTab" data-arg="skill">技能</button>
        <button class="menu-tab" id="menu-tab-activity" data-action="menuTab" data-arg="activity">活动</button>
      </div>

      <!-- 第一页：关卡选择 -->
      <div id="page-stage" class="menu-page">
        <div class="stage-selector">
          <button class="btn btn-sec" id="prevStageBtn" data-action="prevStage">⬅ 上一关</button>
          <div class="stage-current">第 <strong id="selStage">1</strong> 关</div>
          <button class="btn btn-sec" id="nextStageBtn" data-action="nextStage">下一关 ➡</button>
        </div>
        <div id="selStageInfo" class="stage-info"></div>
        <button id="enterStageBtn" class="btn btn-gold" data-action="enterStage">⚔️ 进入第 1 关 ⚔️</button>
      </div>

      <!-- 第二页：装备 -->
      <div id="page-equip" class="menu-page hidden">
        <div id="equipList" class="equip-list"></div>
      </div>

      <!-- 第三页：技能图鉴 -->
      <div id="page-skill" class="menu-page hidden">
        <div id="skillPageList" class="skill-page-list"></div>
      </div>

      <!-- 第四页：活动 -->
      <div id="page-activity" class="menu-page hidden">
        <div id="activityPageList" class="activity-page-list"></div>
      </div>
    </div>

    <!-- 加载区（启动时） -->
    <div id="loading-area">
      <div id="loading-bar-wrap" class="hidden">
        <div id="loading-bar-fill"></div>
      </div>
      <div id="loading-text"></div>
    </div>

  </div>

  <!-- 抽卡面板（升级 3 选 1） -->
  <div id="cardPanel" class="modal-overlay hidden">
    <div class="modal-box panel">
      <h2>✨ 升级！选择一张卡牌</h2>
      <div id="cardOptions" class="card-options"></div>
    </div>
  </div>

  <!-- 结算面板（通关/战败） -->
  <div id="resultPanel" class="modal-overlay hidden">
    <div class="modal-box panel">
      <h2 id="resultTitle">通关！</h2>
      <p id="resultStats"></p>
      <p class="result-xp">总经验 <strong id="resultXp">+0</strong></p>
      <button class="btn btn-gold" data-action="backToMenu">返回主页</button>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsPanel" class="modal-overlay hidden">
    <div class="bg" data-action="toggleSettingsPanel"></div>
    <div class="modal-box panel">
      <h2>⚙️ 设置</h2>
      <div class="settings-list">
        <button class="btn btn-gold" data-action="manualSave">💾 手动保存</button>
        <button class="btn" data-action="exportSaveData">📤 导出存档</button>
        <button class="btn btn-sec" data-action="importSaveData">📥 导入存档</button>
        <button class="btn btn-sec btn-danger" data-action="resetGameData">🗑️ 重置游戏</button>
      </div>
      <button class="btn btn-sm btn-sec settings-close" data-action="toggleSettingsPanel">关闭</button>
    </div>
  </div>

  <!-- Damage flash & save notification -->
  <div id="damageFlash"></div>
  <div id="saveNotif">已存档</div>
</div>
</div><!-- /gameWrap -->

<script type="module" src="src/main.js"></script>
</body>
</html>
