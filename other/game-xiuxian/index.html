<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>百世修仙 - 文字修仙世界</title>
<link rel="stylesheet" href="resources/style.css">
<script src="lib/phaser.min.js"></script>
<script type="importmap">
{
  "imports": {
    "@/": "./src/"
  }
}
</script>
<script>
window.xiuxianHome = () => ({
  activeTab: 'stage',
  settingsOpen: false,
  selectedStage: 1,
  maxStage: 1,
  totalLevel: 1,
  totalXp: 0,
  totalXpToNext: 40,
  stageInfo: '',
  toggleSettings() { this.settingsOpen = !this.settingsOpen; },
  switchTab(tab) {
    this.activeTab = tab;
    window.XiuxianMenuBridge?.menuTab(tab);
  },
  previousStage() { window.XiuxianMenuBridge?.prevStage(); },
  nextStage() { window.XiuxianMenuBridge?.nextStage(); },
  enterStage() { window.XiuxianMenuBridge?.enterStage(); }
});
</script>
<script defer src="lib/alpine.min.js"></script>
</head>
<body>
<div id="gameWrap">
<canvas id="gameCanvas"></canvas>

<div class="ui-layer">
  <!-- 局内 HUD -->
  <div id="hud" class="panel">
    <div class="flex-between">
      <span>第 <strong id="stageText">1</strong> 关</span>
      <span>波次 <span id="waveCounter">0/5</span></span>
    </div>
    <div class="bar-wrap"><span class="label">●</span><div class="bar-bg"><div id="hpFill" class="bar-fill"></div></div><span class="bar-text" id="hpText">100/100</span></div>
    <div class="bar-wrap"><span class="label">★</span><div class="bar-bg"><div id="xpFill" class="bar-fill"></div></div><span class="bar-text" id="xpText">0/5</span></div>
    <div class="flex-between mt8">
      <span>Lv.<span id="levelText">1</span></span>
      <span>击杀 <strong id="killText">0</strong></span>
      <span>总等级 <strong id="totalLevelText">1</strong></span>
    </div>
    <div id="cardsHud"></div>
  </div>
  <div id="wallHud" class="panel" aria-label="城墙生命值">
    <div class="wall-hud-title"><span>🧱 城墙</span><span id="wallHpText">100/100</span></div>
    <div class="bar-bg"><div id="wallHpFill" class="bar-fill"></div></div>
  </div>

  <div id="battleLoading" class="battle-loading hidden">
    <div class="battle-loading-box panel">
      <div class="loading-spinner" aria-hidden="true"></div>
      <div id="battleLoadingText">正在进入关卡...</div>
    </div>
  </div>

  <!-- Status -->
  <div id="status">消息</div>
  <!-- Loot popup -->
  <div id="loot-popup" class="panel"></div>

  <!-- 主页（微信式布局：顶导航栏 / 等级条 / 列表内容 / 底部 tab） -->
  <div id="mainMenu" x-data="xiuxianHome()" x-cloak>
    <div id="menu-topbar">
      <!-- 顶部导航栏 -->
      <div id="app-bar">
        <span id="app-title">百世修仙</span>
      </div>

      <!-- 等级条（微信个人信息横条风格） -->
      <div id="level-bar" class="panel">
        <span class="level-label">总等级 <strong id="menuTotalLevel" x-text="totalLevel">1</strong></span>
        <div class="bar-bg"><div id="menuTotalXpFill" class="bar-fill"></div></div>
        <span id="menuTotalXpText" x-text="totalXp + '/' + totalXpToNext">0/40</span>
        <span class="level-max">通关 <strong id="menuMaxStage" x-text="maxStage - 1">0</strong></span>
      </div>
      <button class="btn btn-sec app-settings top-settings" type="button" @click="toggleSettings()" aria-label="设置">⚙️</button>
    </div>

    <!-- 加载区（启动时） -->
    <div id="loading-area">
      <div id="loading-bar-wrap" class="hidden">
        <div id="loading-bar-fill"></div>
      </div>
      <div id="loading-text"></div>
    </div>

    <!-- 内容区（微信列表风格） -->
    <div id="menu-content">
      <div id="page-stage" class="menu-page" x-show="activeTab === 'stage'">
        <div id="selStageInfo" class="stage-info" x-text="stageInfo"></div>
        <div class="stage-card-track" aria-label="关卡选择">
          <button id="prevStageCard" class="stage-card stage-card-side" type="button" :disabled="selectedStage <= 1" @click="previousStage()" aria-label="上一关">
            <span>上一关</span>
          </button>
          <button class="stage-card stage-card-current" type="button" @click="enterStage()" aria-label="进入当前关卡">
            <span class="stage-card-current-content">
              <small>当前关卡</small>
              <strong x-text="'第 ' + selectedStage + ' 关'">第 1 关</strong>
              <em>点击进入</em>
            </span>
          </button>
          <button id="nextStageCard" class="stage-card stage-card-side" type="button" :disabled="selectedStage >= maxStage" @click="nextStage()" aria-label="下一关">
            <span>下一关</span>
          </button>
        </div>
      </div>

      <div id="page-equip" class="menu-page" x-show="activeTab === 'equip'">
        <div id="equipList" class="equip-list"></div>
      </div>

      <div id="page-skill" class="menu-page" x-show="activeTab === 'skill'">
        <div id="skillPageList" class="skill-page-list"></div>
      </div>

      <div id="page-activity" class="menu-page" x-show="activeTab === 'activity'">
        <div id="activityPageList" class="activity-page-list"></div>
      </div>
    </div>

    <!-- 底部 tab（微信式：图标 + 文字） -->
    <div id="menu-tabs">
      <button class="menu-tab" id="menu-tab-stage" type="button" :class="{ active: activeTab === 'stage' }" @click="switchTab('stage')">
        <span class="menu-tab-icon">🗡️</span><span class="menu-tab-label">关卡</span>
      </button>
      <button class="menu-tab" id="menu-tab-equip" type="button" :class="{ active: activeTab === 'equip' }" @click="switchTab('equip')">
        <span class="menu-tab-icon">🛡️</span><span class="menu-tab-label">装备</span>
      </button>
      <button class="menu-tab" id="menu-tab-skill" type="button" :class="{ active: activeTab === 'skill' }" @click="switchTab('skill')">
        <span class="menu-tab-icon">📖</span><span class="menu-tab-label">技能</span>
      </button>
      <button class="menu-tab" id="menu-tab-activity" type="button" :class="{ active: activeTab === 'activity' }" @click="switchTab('activity')">
        <span class="menu-tab-icon">🎁</span><span class="menu-tab-label">活动</span>
      </button>
    </div>

  </div>

  <!-- 抽卡面板（升级 3 选 1） -->
  <div id="cardPanel" class="modal-overlay hidden">
    <div class="modal-box panel">
      <h2>✨ 升级！选择一张卡牌</h2>
      <div id="cardOptions" class="card-options"></div>
    </div>
  </div>

  <!-- 结算面板（通关/战败） -->
  <div id="resultPanel" class="modal-overlay hidden">
    <div class="modal-box panel">
      <h2 id="resultTitle">通关！</h2>
      <p id="resultStats"></p>
      <p class="result-xp">总经验 <strong id="resultXp">+0</strong></p>
      <button class="btn btn-gold" data-action="backToMenu">返回主页</button>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsPanel" class="modal-overlay" x-show="settingsOpen" x-transition x-cloak>
    <div class="bg" @click="toggleSettings()"></div>
    <div class="modal-box panel">
      <h2>⚙️ 设置</h2>
      <div class="settings-list">
        <button class="btn btn-gold" data-action="manualSave">💾 手动保存</button>
        <button class="btn" data-action="exportSaveData">📤 导出存档</button>
        <button class="btn btn-sec" data-action="importSaveData">📥 导入存档</button>
        <button class="btn btn-sec btn-danger" data-action="resetGameData">🗑️ 重置游戏</button>
      </div>
      <button class="btn btn-sm btn-sec settings-close" type="button" @click="toggleSettings()">关闭</button>
    </div>
  </div>

  <!-- Damage flash & save notification -->
  <div id="damageFlash"></div>
  <div id="saveNotif">已存档</div>
</div>
</div><!-- /gameWrap -->

<script type="module" src="src/main.js"></script>
</body>
</html>
