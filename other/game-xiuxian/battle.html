<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>百世修仙 · 关卡</title>
<link rel="stylesheet" href="resources/style.css">
<script src="lib/phaser.min.js"></script>
<script type="importmap">
{
  "imports": {
    "@/": "./src/"
  }
}
</script>
</head>
<body data-page="battle">
<div id="gameWrap">
  <canvas id="gameCanvas"></canvas>
  <div class="ui-layer">
    <div id="hud" class="panel">
      <div class="flex-between"><span>第 <strong id="stageText">1</strong> 关</span><span>波次 <span id="waveCounter">0/5</span></span></div>
      <div class="bar-wrap"><span class="label">★</span><div class="bar-bg"><div id="xpFill" class="bar-fill"></div></div><span class="bar-text" id="xpText">0/5</span></div>
      <div class="flex-between mt8"><span>Lv.<span id="levelText">1</span></span><span>总等级 <strong id="totalLevelText">1</strong></span></div>
      <div id="cardsHud"></div>
    </div>
    <div id="wallHud" class="panel" aria-label="城墙生命值">
      <div class="wall-hud-title"><span>🧱 城墙</span><span id="wallHpText">100/100</span></div>
      <div class="bar-bg"><div id="wallHpFill" class="bar-fill"></div></div>
    </div>
    <div id="battleLoading" class="battle-loading">
      <div class="battle-loading-box panel"><div class="loading-spinner"></div><div id="battleLoadingText">正在加载关卡...</div></div>
    </div>
    <div id="status">消息</div>
    <div id="loot-popup" class="panel"></div>
    <div id="cardPanel" class="modal-overlay hidden">
      <div class="modal-box panel"><h2>✨ 升级！选择一张卡牌</h2><div id="cardOptions" class="card-options"></div></div>
    </div>
    <div id="resultPanel" class="modal-overlay hidden">
      <div class="modal-box panel"><h2 id="resultTitle">通关！</h2><p id="resultStats"></p><p class="result-xp">总经验 <strong id="resultXp">+0</strong></p><button class="btn btn-gold" data-action="backToMenu">返回主页</button></div>
    </div>
    <div id="damageFlash"></div>
    <div id="saveNotif">已存档</div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
