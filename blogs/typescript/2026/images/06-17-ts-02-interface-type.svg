<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">interface 与 type 该怎么选动态示意图</title>
  <desc id="desc">以输入、核心处理和结果验证三个阶段展示interface 与 type 该怎么选的实践流程。</desc>
  <style>
    .heading{font:700 19px system-ui,-apple-system,sans-serif;fill:#2b2025}
    .eyebrow{font:700 11px system-ui,-apple-system,sans-serif;fill:#c93868;letter-spacing:.12em}
    .label{font:700 15px system-ui,-apple-system,sans-serif;fill:#2b2025}
    .sub{font:13px system-ui,-apple-system,sans-serif;fill:#74636a}
    .node{fill:#fff;stroke:#f0dce4;stroke-width:2}.active{fill:#fff1f5;stroke:#db4b78;stroke-width:2}
    .flow{fill:none;stroke:#db4b78;stroke-width:4;stroke-linecap:round;stroke-dasharray:9 13;animation:dash 1.7s linear infinite}
    .pulse{fill:#db4b78;animation:pulse 1.6s ease-in-out infinite}.float{animation:float 2.4s ease-in-out infinite}
    @keyframes dash{to{stroke-dashoffset:-44}}@keyframes pulse{50%{opacity:.35;r:11}}@keyframes float{50%{transform:translateY(-5px)}}
    @media(prefers-reduced-motion:reduce){.flow,.pulse,.float{animation:none}}
  </style>
  <rect width="760" height="360" rx="26" fill="#fff8fa"/>
  <text x="40" y="34" class="eyebrow">TYPESCRIPT · VISUAL NOTE</text>
  <text x="40" y="58" class="heading">interface 与 type 该怎么选</text>

  <g transform="translate(0 0)">
    <rect x="40" y="132" width="190" height="116" rx="18" class="node float"/>
    <text x="135" y="169" text-anchor="middle" class="label">复杂组合类型优先使用…</text>
    <text x="135" y="198" text-anchor="middle" class="sub">输入与边界</text><circle cx="135" cy="222" r="7" class="pulse"/>
    <path d="M230 190H285" class="flow"/>
    <rect x="285" y="112" width="190" height="156" rx="18" class="active"/>
    <text x="380" y="169" text-anchor="middle" class="label">需要面向对象扩展时考…</text>
    <text x="380" y="198" text-anchor="middle" class="sub">核心机制</text><path d="M338 224h84" stroke="#f6b4c9" stroke-width="8" stroke-linecap="round"/>
    <path d="M475 190H530" class="flow"/>
    <rect x="530" y="132" width="190" height="116" rx="18" class="node float"/>
    <text x="625" y="169" text-anchor="middle" class="label">保持同一模块内的风格…</text>
    <text x="625" y="198" text-anchor="middle" class="sub">验证与反馈</text><path d="M625 248v48H135v-48" class="flow"/>
  </g>
</svg>
