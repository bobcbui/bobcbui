<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">TypeScript 构建流水线</title>
  <desc id="desc">TypeScript 源码经过类型检查和打包后进入浏览器运行。</desc>
  <style>
    .label{font:700 16px system-ui,sans-serif;fill:#2b2025}.sub{font:13px system-ui,sans-serif;fill:#74636a}
    .box{fill:#fff;stroke:#f0dce4;stroke-width:2}.accent{fill:#fce7ef;stroke:#db4b78;stroke-width:2}
    .flow{fill:none;stroke:#db4b78;stroke-width:4;stroke-linecap:round;stroke-dasharray:9 13;animation:move 1.7s linear infinite}
    @keyframes move{to{stroke-dashoffset:-44}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <rect width="720" height="300" rx="24" fill="#fff8fa"/><text x="36" y="42" class="label">类型安全最终要落到运行产物</text>
  <rect x="34" y="105" width="142" height="94" rx="16" class="box"/><text x="105" y="141" text-anchor="middle" class="label">.ts</text><text x="105" y="168" text-anchor="middle" class="sub">源码</text>
  <path d="M176 152h50" class="flow"/>
  <rect x="226" y="105" width="142" height="94" rx="16" class="accent"/><text x="297" y="141" text-anchor="middle" class="label">Check</text><text x="297" y="168" text-anchor="middle" class="sub">类型检查</text>
  <path d="M368 152h50" class="flow"/>
  <rect x="418" y="105" width="142" height="94" rx="16" class="accent"/><text x="489" y="141" text-anchor="middle" class="label">Bundle</text><text x="489" y="168" text-anchor="middle" class="sub">拆包与压缩</text>
  <path d="M560 152h50" class="flow"/>
  <rect x="610" y="105" width="78" height="94" rx="16" class="box"/><text x="649" y="141" text-anchor="middle" class="label">Web</text><text x="649" y="168" text-anchor="middle" class="sub">运行</text>
</svg>
