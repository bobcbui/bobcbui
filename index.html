<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>牛马程序员 - 带你成为真正的牛马</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script defer src="/static/alpine.js"></script>
    <script defer src="/libs/alpine.min.js"></script>
  </head>
  <body class="home-page">
    <site-header class="site-header" x-data="siteHeader" x-cloak></site-header>

    <div
      id="home-app"
      x-data="homePage"
      x-cloak
      @keydown.window="focusShortcut($event)"
    >
      <main class="home-main">
        <div class="home-layout">
          <section class="home-content">
            <section class="hero-section">
              <div class="hero-copy">
                <p class="hero-kicker">
                  LEARNING LAB <span>·</span> 持续更新中
                </p>
                <h1 class="hero-title">把今天学会的，<br />变成明天会用的。</h1>
                <p class="hero-desc">
                  从英语、编程到计算机技术，按自己的节奏建立一套真正能用的知识体系。
                </p>
                <div class="hero-actions">
                  <a class="hero-primary" href="/page/study.html"
                    >开始学习 <svg class="ui-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9m-4-4 4 4-4 4" /></svg></a
                  >
                  <a class="hero-secondary" href="/page/english.html"
                    >先从英语开始</a
                  >
                </div>
              </div>
              <img
                class="hero-illustration"
                src="/static/images/hero-anime-programmer-girl.png"
                alt="一位戴着耳机趴在床上看书的二次元女生"
                width="1536"
                height="1024"
              />
            </section>

            <form
              class="content-search"
              role="search"
              @submit.prevent="showSearchResults"
            >
              <span class="search-icon" aria-hidden="true">⌕</span>
              <label class="sr-only" for="site-search">筛选本站导航</label>
              <input
                id="site-search"
                x-model="query"
                type="search"
                placeholder="筛选本站导航（按 / 聚焦）"
                autocomplete="off"
              />
              <button type="submit">站内搜索</button>
            </form>

            <section
              class="site-search-results"
              x-show="query.trim()"
              x-transition.opacity
              aria-live="polite"
              aria-label="站内搜索结果"
            >
              <div class="site-search-results-header">
                <h2>搜索结果</h2>
                <span x-text="`${searchResults.length} 个结果`"></span>
              </div>
              <div class="site-search-results-list" x-show="searchResults.length">
                <template x-for="result in searchResults" :key="result.href + result.title">
                  <a :href="result.href">
                    <span class="site-search-result-group" x-text="result.group"></span>
                    <strong x-text="result.title"></strong>
                    <small x-text="result.desc"></small>
                  </a>
                </template>
              </div>
              <p class="site-search-results-empty" x-show="!isLoading && !searchResults.length">
                没有找到相关的站内内容。
              </p>
              <p class="site-search-results-empty" x-show="isLoading">正在加载站内内容…</p>
            </section>

            <section class="nav-grid" aria-label="网站导航" aria-live="polite">
              <template x-for="item in (isLoading ? 6 : 0)" :key="item">
                <div class="nav-group nav-skeleton" aria-hidden="true"></div>
              </template>

              <template x-for="group in groups" :key="group.name">
                <article class="nav-group" x-data="navGroup(group)">
                  <div class="nav-group-header">
                    <span
                      class="nav-group-emoji"
                      aria-hidden="true"
                      x-text="group.emoji"
                    ></span>
                    <h2 class="nav-group-title" x-text="group.name"></h2>
                    <a
                      class="nav-group-more"
                      x-show="showMore"
                      :href="landingHref"
                      :aria-label="`查看更多${group.name}内容`"
                      >更多 <svg class="ui-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9m-4-4 4 4-4 4" /></svg></a
                    >
                  </div>
                  <div class="nav-group-links">
                    <template
                      x-for="(item, index) in visibleItems"
                      :key="item.href + index"
                    >
                      <a :href="item.href"
                        ><span aria-hidden="true">•</span
                        ><span x-text="item.title"></span
                      ></a>
                    </template>
                  </div>
                  <button
                    class="nav-group-toggle"
                    type="button"
                    x-show="hasMore"
                    @click="expanded = !expanded"
                    x-text="expanded ? '收起入口' : '展开全部入口'"
                  ></button>
                </article>
              </template>

              <p
                x-show="!isLoading && !errorMessage && !groups.length"
                class="nav-empty"
              >
                没有找到匹配的导航入口。
              </p>
              <p x-show="errorMessage" class="nav-error">
                导航数据加载失败，请刷新重试。<span
                  x-text="errorMessage"
                ></span>
              </p>
            </section>

            <section class="home-feature-grid" aria-label="每日内容">
              <article class="home-feature-card daily-english-card">
                <header class="feature-card-header">
                  <div>
                    <p class="feature-kicker">DAILY ENGLISH</p>
                    <h2 x-text="dailyEnglish.title"></h2>
                  </div>
                  <time x-text="dailyEnglish.date"></time>
                </header>
                <div class="feature-card-body">
                  <p class="daily-english-text" x-text="dailyEnglish.text"></p>
                  <p class="daily-english-translation">
                    <strong>译</strong
                    ><span x-text="dailyEnglish.translation"></span>
                  </p>
                  <div class="daily-english-words" aria-label="今日词汇">
                    <template x-for="word in dailyEnglish.words" :key="word.term"
                      ><span
                        ><strong x-text="word.term"></strong
                        ><small x-text="word.meaning"></small></span
                    ></template>
                  </div>
                </div>
                <footer class="feature-card-footer">
                  <a class="feature-card-link" href="/page/english.html"
                    >进入英语学习 <svg class="ui-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9m-4-4 4 4-4 4" /></svg></a
                  >
                </footer>
              </article>

              <article class="home-feature-card github-trends-card">
                <header class="feature-card-header">
                  <div>
                    <p class="feature-kicker">GITHUB TRENDS</p>
                    <h2>近 7 天热门仓库</h2>
                  </div>
                  <a
                    class="feature-card-source"
                    href="https://github.com/trending"
                    target="_blank"
                    rel="noopener"
                    >GitHub <svg class="ui-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 11 12 4m-5 0h5v5" /></svg></a
                  >
                </header>
                <div class="feature-card-body">
                  <p x-show="trendsLoading" class="feature-card-loading">
                    正在加载 GitHub 趋势…
                  </p>
                  <p
                    x-show="trendsError"
                    class="feature-card-loading"
                    x-text="trendsError"
                  ></p>
                  <div
                    class="github-repo-list"
                    x-show="!trendsLoading && !trendsError"
                  >
                    <template x-for="repo in trendingRepos" :key="repo.name">
                      <a
                        class="github-repo"
                        :href="repo.url"
                        target="_blank"
                        rel="noopener"
                      >
                        <span class="github-repo-main"
                          ><strong x-text="repo.name"></strong
                          ><small x-text="repo.description"></small
                        ></span>
                        <span class="github-repo-meta"
                          ><small x-text="repo.language"></small
                          ><b>★ <span x-text="formatStars(repo.stars)"></span></b
                        ></span>
                      </a>
                    </template>
                  </div>
                </div>
                <footer class="feature-card-footer">
                  <a
                    class="feature-card-link"
                    href="https://github.com/trending"
                    target="_blank"
                    rel="noopener"
                    >查看 GitHub Trending <svg class="ui-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9m-4-4 4 4-4 4" /></svg></a
                  >
                </footer>
              </article>
            </section>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
